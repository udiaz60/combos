<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lector de Seriales - Inventario TI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    #reader { width: 100% !important; border: none !important; background: transparent !important; }
    #reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; max-height: 220px; }
    #reader__scan_region { background: transparent !important; }
    #reader__dashboard_section_csr span, #reader__status_span { display: none !important; }

    /* Láser de enfoque activo solo en modo continuo */
    .laser-line {
      position: absolute; top: 50%; left: 8%; right: 8%; height: 2px;
      background: rgba(16, 185, 129, 0.85); box-shadow: 0 0 10px rgba(16, 185, 129, 1);
      transform: translateY(-50%); pointer-events: none; z-index: 10;
    }

    .toast-anim {
      animation: popToast 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes popToast {
      from { opacity: 0; transform: translateY(-10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen select-none font-sans">

  <!-- Toast Flotante -->
  <div id="toast-box" class="fixed top-14 left-0 right-0 z-50 flex flex-col items-center pointer-events-none px-4 max-w-sm mx-auto"></div>

  <!-- Barra Superior -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between sticky top-0 z-30 shadow-md">
    <div>
      <h1 class="text-xs font-bold uppercase tracking-wider text-slate-200">Inventario TI</h1>
      <p class="text-[11px] text-emerald-400 font-semibold" id="header-mode-desc">Modo Continuo (Code 128/39)</p>
    </div>
    <span id="badge-total" class="bg-indigo-950 border border-indigo-500/40 text-indigo-300 font-mono text-xs px-2.5 py-1 rounded-full font-bold">
      0 seriales
    </span>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="flex-1 p-3 pb-24 overflow-y-auto space-y-3 max-w-md mx-auto w-full">
    
    <!-- SECCIÓN CÁMARA GLOBAL (Visible tanto en Continuo como en Foto Lote) -->
    <div id="camera-global-wrapper" class="space-y-2">
      
      <!-- Observación Fija -->
      <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl shadow-sm">
        <label for="obs-input" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">
          Observación fija (Ubicación / Lote)
        </label>
        <input 
          type="text" 
          id="obs-input" 
          placeholder="Ej: Sala 102 - Torre A" 
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors"
        />
      </div>

      <!-- Visor de Cámara en Vivo Constante -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden p-1 relative shadow-inner min-h-[170px] flex items-center justify-center">
        <div id="reader"></div>
        <div id="laser-line" class="laser-line hidden"></div>
        
        <div id="cam-status" class="p-6 text-center text-xs space-y-3 z-20">
          <p id="cam-msg" class="text-slate-400 leading-relaxed">Iniciando cámara trasera...</p>
          <button id="btn-permiso" onclick="iniciarCamaraDirecta()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow-lg active:scale-95 transition-all">
            📷 Tocar aquí para Conceder Permiso
          </button>
        </div>
      </div>

      <!-- Controles de Cámara (Zoom y Linterna) -->
      <div class="flex items-center justify-between bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
        <div id="zoom-container" class="hidden flex items-center gap-1">
          <span class="text-[10px] font-bold text-slate-400 mr-1 uppercase">Zoom:</span>
          <button id="btn-zoom-1" onclick="aplicarZoom(1)" class="bg-indigo-600 text-white text-xs font-mono font-bold px-2 py-0.5 rounded">1x</button>
          <button id="btn-zoom-2" onclick="aplicarZoom(2)" class="bg-slate-800 text-slate-300 hover:text-white text-xs font-mono font-bold px-2 py-0.5 rounded">2x</button>
        </div>
        <div id="zoom-placeholder" class="text-[10px] text-slate-500">Distancia ideal: 15-20 cm</div>

        <button id="btn-torch" onclick="toggleTorch()" class="hidden bg-slate-800 border border-slate-700 text-xs px-2.5 py-1 rounded-lg text-slate-300 active:bg-slate-700 flex items-center gap-1">
          <span>🔦</span> Linterna
        </button>
      </div>

    </div>

    <!-- PESTAÑA 1: MODO CONTINUO (Acciones Rápidas) -->
    <section id="panel-scan" class="space-y-2.5">
      <button 
        onclick="copiarParaSheets()" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-all shadow-md shadow-indigo-600/30 flex items-center justify-center gap-2"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
        </svg>
        <span>📋 Copiar Lista para Sheets / Excel</span>
      </button>

      <!-- Entrada manual -->
      <div class="bg-slate-900 border border-slate-800 p-2 rounded-xl flex gap-2">
        <input 
          type="text" 
          id="manual-input" 
          placeholder="Entrada manual o pistola..." 
          onkeydown="if(event.key==='Enter') agregarManual();" 
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono placeholder-slate-600 focus:outline-none focus:border-indigo-500"
        />
        <button onclick="agregarManual()" class="bg-slate-800 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 text-slate-200">
          +
        </button>
      </div>
    </section>

    <!-- PESTAÑA 2: MODO FOTO MULTI-SCAN (Viendo la cámara en vivo) -->
    <section id="panel-photo" class="hidden space-y-3">
      
      <!-- Botón de Disparo: Congelar mientras miras la cámara -->
      <div id="controls-capture-live" class="space-y-2">
        <button 
          onclick="congelarYEnmarcar()" 
          class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white font-bold py-3.5 px-4 rounded-xl text-sm transition-all shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span>📸 Congelar y Enmarcar Códigos</span>
        </button>
        <p class="text-[11px] text-center text-slate-500">Apunta a la caja con ambos códigos en pantalla y pulsa el botón.</p>
      </div>

      <!-- Tarjeta con la Foto Congelada y los Marcos Interactivos -->
      <div id="photo-preview-card" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-2.5 space-y-3">
        <div class="flex justify-between items-center px-1">
          <span class="text-xs font-bold text-slate-200">Foto Congelada</span>
          <button onclick="reanudarCamaraEnVivo()" class="text-xs text-indigo-400 hover:underline flex items-center gap-1">
            <span>🔄</span> Repetir foto
          </button>
        </div>

        <div class="relative overflow-hidden rounded-lg border border-slate-700 bg-black flex justify-center items-center">
          <canvas id="photo-canvas" class="max-w-full h-auto cursor-pointer block"></canvas>
          <div id="photo-loading-overlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center text-xs text-emerald-400 gap-2">
            <svg class="animate-spin h-6 w-6 text-emerald-500" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Detectando códigos...
          </div>
        </div>

        <div class="flex items-center justify-between px-1 text-[11px]">
          <span class="text-slate-400">Toca el recuadro para marcar/desmarcar:</span>
          <button onclick="marcarTodos(true)" class="text-indigo-400 hover:underline">Todos</button>
        </div>

        <!-- Lista de Códigos Detectados -->
        <div id="detected-checkboxes-list" class="space-y-1.5 max-h-36 overflow-y-auto pr-1"></div>

        <!-- Confirmar Lote -->
        <button 
          id="btn-confirmar-lote" 
          onclick="importarCodigosSeleccionados()" 
          disabled
          class="w-full bg-emerald-600 disabled:bg-slate-800 disabled:text-slate-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl text-xs transition-all shadow-md flex items-center justify-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <span id="btn-confirm-text">Registrar Códigos</span>
        </button>
      </div>

    </section>

    <!-- PESTAÑA 3: LISTA DE SERIALES REGISTRADOS -->
    <section id="panel-list" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Seriales en Memoria Local</h2>
        <button onclick="vaciarTodoConfirm()" class="text-xs text-rose-400 hover:underline">
          Vaciar Todo
        </button>
      </div>
      <div id="items-container" class="space-y-1.5 max-h-[60vh] overflow-y-auto"></div>
    </section>

  </main>

  <!-- NAVEGACIÓN INFERIOR (3 Pestañas) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around p-2 z-30">
    <button id="btn-nav-scan" onclick="switchTab('scan')" class="flex-1 flex flex-col items-center py-1 text-indigo-400 font-bold text-xs">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
      </svg>
      Continuo
    </button>
    <button id="btn-nav-photo" onclick="switchTab('photo')" class="flex-1 flex flex-col items-center py-1 text-slate-400 hover:text-slate-200 text-xs">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      Foto Lote
    </button>
    <button id="btn-nav-list" onclick="switchTab('list')" class="flex-1 flex flex-col items-center py-1 text-slate-400 hover:text-slate-200 text-xs">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
      </svg>
      Lista (<span id="nav-count">0</span>)
    </button>
  </nav>

  <script>
    const STORAGE_KEY = 'inventario_html_seriales';
    let html5QrCode = null;
    let isProcessing = false;
    let isTorchOn = false;
    let lastCode = '';
    let lastTime = 0;
    let currentTab = 'scan'; // 'scan', 'photo', 'list'

    // Datos de la foto congelada
    let imagenActual = null;
    let codigosDetectados = [];

    // --- AUDIO SINTETIZADO ---
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine') {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    const soundSuccess = () => playTone(1200, 0.06);
    const soundDuplicate = () => { playTone(300, 0.1, 'square'); setTimeout(() => playTone(220, 0.12, 'square'), 110); };

    document.addEventListener('touchstart', () => getAudioCtx(), { once: true });
    document.addEventListener('click', () => getAudioCtx(), { once: true });

    // --- LOCALSTORAGE ---
    function getDatos() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
    }

    function guardarDatos(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      renderizarLista();
    }

    function renderizarLista() {
      const items = getDatos();
      document.getElementById('badge-total').innerText = `${items.length} seriales`;
      document.getElementById('nav-count').innerText = items.length;

      const container = document.getElementById('items-container');
      if (items.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-600 text-center py-6">No hay seriales guardados.</p>';
        return;
      }

      container.innerHTML = items.map((it, idx) => `
        <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl flex justify-between items-center text-xs">
          <div class="overflow-hidden mr-2">
            <span class="font-mono font-bold text-emerald-400 text-sm">${it.serial}</span>
            <p class="text-[11px] text-slate-400 truncate">${it.observacion || '<i class="text-slate-600">Sin nota</i>'}</p>
            <span class="text-[10px] text-slate-500 font-mono">${it.fecha}</span>
          </div>
          <button onclick="eliminarItem(${idx})" class="text-slate-500 hover:text-rose-400 p-1.5 flex-shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </button>
        </div>
      `).join('');
    }

    function eliminarItem(idx) {
      const items = getDatos();
      const borrado = items.splice(idx, 1);
      guardarDatos(items);
      showToast(`Eliminado: ${borrado[0].serial}`, "warn");
    }

    function vaciarTodoConfirm() {
      if (confirm("¿Seguro de vaciar todos los seriales escaneados?")) {
        guardarDatos([]);
        showToast("Lista vaciada", "warn");
      }
    }

    function limpiarSerial(raw) {
      if (!raw) return '';
      let s = String(raw).replace(/[\x00-\x1F\x7F-\x9F]/g, '').trim();
      s = s.replace(/^(S\/N|SN|SERIAL)[\s:\-\]]*/i, '');
      s = s.replace(/^[\[\(\{]+|[\]\)\}]+$/g, '').trim();
      return s;
    }

    function registrarSerial(serialBruto, silencio = false) {
      const limpio = limpiarSerial(serialBruto);
      if (!limpio) return false;

      // Si es el UPC de 12 dígitos, ignorarlo
      if (/^\d{12}$/.test(limpio)) {
        if (!silencio) showToast("UPC comercial ignorado", "warn", 1200);
        return false;
      }

      const items = getDatos();
      const existe = items.some(i => i.serial.toUpperCase() === limpio.toUpperCase());
      if (existe) {
        if (!silencio) {
          soundDuplicate();
          if (navigator.vibrate) navigator.vibrate([70, 50, 70]);
          showToast(`Ya existe: ${limpio}`, "warn");
        }
        return false;
      }

      const obs = document.getElementById('obs-input').value;
      const d = new Date();
      const fecha = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      items.unshift({ serial: limpio, observacion: obs, fecha: fecha });
      guardarDatos(items);

      if (!silencio) {
        soundSuccess();
        if (navigator.vibrate) navigator.vibrate(50);
        showToast(`OK: ${limpio}`, "success");
      }
      return true;
    }

    function agregarManual() {
      const input = document.getElementById('manual-input');
      registrarSerial(input.value);
      input.value = '';
    }

    async function copiarParaSheets() {
      const items = getDatos();
      if (items.length === 0) {
        alert("No hay seriales para copiar.");
        return;
      }

      const lineas = items.map(i => `${i.serial}\t${i.observacion || ''}\t${i.fecha}`);
      const tsvContent = `Serial\tObservación\tFecha\n` + lineas.join('\n');

      try {
        await navigator.clipboard.writeText(tsvContent);
        showToast(`¡Copiados ${items.length} seriales!`, "success", 2000);
        alert(`¡Copiado al portapapeles!\n\nAbre Google Sheets o Excel y dale Pegar (Ctrl+V).`);
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = tsvContent;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast("Copiado al portapapeles", "success");
      }
    }

    // --- CÁMARA EN VIVO ---
    function onScanSuccess(decodedText) {
      // Si el usuario está en la pestaña "Foto Lote", no registrar en automático
      if (currentTab === 'photo') return;

      const raw = String(decodedText || '').trim();
      if (!raw) return;

      const now = Date.now();
      if (raw === lastCode && (now - lastTime) < 2500) return;

      if (isProcessing) return;
      isProcessing = true;
      lastCode = raw;
      lastTime = now;

      registrarSerial(raw);
      setTimeout(() => { isProcessing = false; }, 200);
    }

    async function iniciarCamaraDirecta() {
      const statusBox = document.getElementById('cam-status');
      const msgEl = document.getElementById('cam-msg');
      const btnPermiso = document.getElementById('btn-permiso');
      const laserLine = document.getElementById('laser-line');

      msgEl.innerText = "Abriendo cámara trasera...";
      btnPermiso.classList.add('hidden');

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader", {
            formatsToSupport: [
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39
            ],
            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            verbose: false
          });
        }

        const scanConfig = { 
          fps: 24, 
          qrbox: (w, h) => {
            const boxW = Math.floor(Math.min(w * 0.90, 320));
            const boxH = Math.floor(Math.min(h * 0.35, 95));
            return { width: Math.max(boxW, 220), height: Math.max(boxH, 75) };
          }
        };

        await html5QrCode.start(
          { facingMode: "environment" },
          scanConfig,
          onScanSuccess
        );

        statusBox.classList.add('hidden');
        if (currentTab === 'scan') laserLine.classList.remove('hidden');
        verificarCapacidadesCamara();

      } catch (err) {
        console.error("Error cámara:", err);
        laserLine.classList.add('hidden');
        btnPermiso.classList.remove('hidden');

        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          msgEl.innerHTML = `
            <span class="text-rose-400 font-bold text-sm block mb-1">Permiso Denegado</span>
            1. Toca el candado 🔒 junto a la URL.<br>
            2. Cambia Cámara a Permitir.<br>
            3. Luego toca el botón de abajo:
          `;
        } else {
          msgEl.innerHTML = `
            <span class="text-amber-400 font-bold block mb-1">No se pudo abrir la cámara</span>
            Si abriste desde WhatsApp, toca los 3 puntos arriba y elige "Abrir en Chrome".
          `;
        }
      }
    }

    function verificarCapacidadesCamara() {
      try {
        const track = html5QrCode.getRunningTrackCameraCapabilities();
        if (track && track.torchFeature && track.torchFeature().isSupported()) {
          document.getElementById('btn-torch').classList.remove('hidden');
        }
        if (track && track.zoomFeature && track.zoomFeature().isSupported()) {
          const maxZoom = track.zoomFeature().max();
          if (maxZoom >= 2) {
            document.getElementById('zoom-container').classList.remove('hidden');
            document.getElementById('zoom-placeholder').classList.add('hidden');
          }
        }
      } catch (e) {}
    }

    function toggleTorch() {
      if (!html5QrCode) return;
      isTorchOn = !isTorchOn;
      html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] }).catch(() => {});
    }

    function aplicarZoom(factor) {
      if (!html5QrCode) return;
      html5QrCode.applyVideoConstraints({ advanced: [{ zoom: factor }] }).then(() => {
        document.getElementById('btn-zoom-1').className = factor === 1 ? "bg-indigo-600 text-white text-xs font-mono font-bold px-2 py-0.5 rounded" : "bg-slate-800 text-slate-300 hover:text-white text-xs font-mono font-bold px-2 py-0.5 rounded";
        document.getElementById('btn-zoom-2').className = factor === 2 ? "bg-indigo-600 text-white text-xs font-mono font-bold px-2 py-0.5 rounded" : "bg-slate-800 text-slate-300 hover:text-white text-xs font-mono font-bold px-2 py-0.5 rounded";
      }).catch(() => {});
    }

    // =========================================================================
    // --- FOTO MULTI-SCAN (VIENDO LA CÁMARA Y CONGELANDO EN VIVO) ---
    // =========================================================================

    function congelarYEnmarcar() {
      const videoEl = document.querySelector("#reader video");
      if (!videoEl || videoEl.videoWidth === 0) {
        showToast("Esperando imagen de la cámara...", "warn");
        return;
      }

      // Capturar fotograma de alta resolución
      const canvas = document.createElement("canvas");
      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

      const img = new Image();
      img.onload = () => procesarImagenParaMultiScan(img);
      img.src = canvas.toDataURL("image/jpeg", 0.95);
    }

    async function procesarImagenParaMultiScan(img) {
      imagenActual = img;
      
      // Mostrar tarjeta de preview y ocultar botón de disparo inicial
      document.getElementById('controls-capture-live').classList.add('hidden');
      document.getElementById('photo-preview-card').classList.remove('hidden');
      const overlay = document.getElementById('photo-loading-overlay');
      overlay.classList.remove('hidden');

      codigosDetectados = [];

      try {
        // Detección de múltiples códigos con coordenadas
        if ('BarcodeDetector' in window) {
          const detector = new BarcodeDetector({ 
            formats: ['code_128', 'code_39', 'upc_a', 'ean_13', 'qr_code'] 
          });
          const barcodes = await detector.detect(img);

          codigosDetectados = barcodes.map((b, i) => {
            const limpio = limpiarSerial(b.rawValue);
            const esUPC = /^\d{12}$/.test(limpio) || b.format === 'upc_a';
            return {
              id: i,
              raw: b.rawValue,
              serial: limpio,
              format: b.format,
              box: {
                x: b.boundingBox.x,
                y: b.boundingBox.y,
                w: b.boundingBox.width,
                h: b.boundingBox.height
              },
              // Seleccionado por defecto: Si es serial sí, si es UPC no
              selected: !esUPC
            };
          });
        } 
        
        // Fallback si el navegador no tiene BarcodeDetector
        if (codigosDetectados.length === 0 && html5QrCode) {
          try {
            const tempFile = dataURLtoFile(img.src, "temp.jpg");
            const res = await html5QrCode.scanFile(tempFile, false);
            const limpio = limpiarSerial(res);
            codigosDetectados.push({
              id: 0,
              raw: res,
              serial: limpio,
              format: 'CODE_128',
              box: { x: img.width * 0.1, y: img.height * 0.35, w: img.width * 0.8, h: img.height * 0.3 },
              selected: true
            });
          } catch (e) {}
        }

      } catch (err) {
        console.error("Error al detectar:", err);
      } finally {
        overlay.classList.add('hidden');
        redibujarCanvasFoto();
        renderizarListaCodigosDetectados();

        if (codigosDetectados.length === 0) {
          showToast("No se detectó código. Intenta a 15-20 cm", "warn", 2500);
        } else {
          showToast(`${codigosDetectados.length} código(s) encontrado(s)`, "success", 1500);
        }
      }
    }

    function reanudarCamaraEnVivo() {
      imagenActual = null;
      codigosDetectados = [];
      document.getElementById('photo-preview-card').classList.add('hidden');
      document.getElementById('controls-capture-live').classList.remove('hidden');
    }

    function dataURLtoFile(dataurl, filename) {
      const arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
            bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while(n--) u8arr[n] = bstr.charCodeAt(n);
      return new File([u8arr], filename, {type:mime});
    }

    function redibujarCanvasFoto() {
      if (!imagenActual) return;
      const canvas = document.getElementById('photo-canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = imagenActual.width;
      canvas.height = imagenActual.height;

      ctx.drawImage(imagenActual, 0, 0);

      codigosDetectados.forEach((item) => {
        const { x, y, w, h } = item.box;
        ctx.save();
        ctx.lineWidth = Math.max(4, Math.floor(canvas.width * 0.007));

        if (item.selected) {
          ctx.strokeStyle = '#10b981';
          ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
        } else {
          ctx.strokeStyle = '#64748b';
          ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
        }

        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);

        const fontSize = Math.max(14, Math.floor(canvas.width * 0.025));
        ctx.font = `bold ${fontSize}px monospace`;
        const label = `${item.selected ? '✓ ' : '✕ '}${item.serial}`;
        const textWidth = ctx.measureText(label).width;

        ctx.fillStyle = item.selected ? '#10b981' : '#475569';
        ctx.fillRect(x, Math.max(0, y - fontSize - 8), textWidth + 12, fontSize + 8);

        ctx.fillStyle = '#ffffff';
        ctx.fillText(label, x + 6, Math.max(fontSize, y - 6));

        ctx.restore();
      });
    }

    // Tocar el Canvas para alternar selección
    document.getElementById('photo-canvas').addEventListener('click', (e) => {
      if (!imagenActual || codigosDetectados.length === 0) return;
      const canvas = document.getElementById('photo-canvas');
      const rect = canvas.getBoundingClientRect();

      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      let tocado = false;
      codigosDetectados.forEach((item) => {
        const { x, y, w, h } = item.box;
        if (clickX >= x && clickX <= (x + w) && clickY >= y && clickY <= (y + h)) {
          item.selected = !item.selected;
          tocado = true;
        }
      });

      if (tocado) {
        redibujarCanvasFoto();
        renderizarListaCodigosDetectados();
      }
    });

    function renderizarListaCodigosDetectados() {
      const container = document.getElementById('detected-checkboxes-list');
      const btnConfirmar = document.getElementById('btn-confirmar-lote');
      const btnText = document.getElementById('btn-confirm-text');

      if (codigosDetectados.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">No se encontraron códigos.</p>';
        btnConfirmar.setAttribute('disabled', 'true');
        btnText.innerText = 'Registrar 0 Códigos';
        return;
      }

      const seleccionadosCount = codigosDetectados.filter(c => c.selected).length;
      btnText.innerText = `Registrar ${seleccionadosCount} Códigos Seleccionados`;
      if (seleccionadosCount > 0) {
        btnConfirmar.removeAttribute('disabled');
      } else {
        btnConfirmar.setAttribute('disabled', 'true');
      }

      container.innerHTML = codigosDetectados.map((it) => {
        const esUPC = /^\d{12}$/.test(it.serial);
        return `
          <div onclick="toggleSelectCodigo(${it.id})" class="p-2 rounded-lg border ${it.selected ? 'bg-emerald-950/40 border-emerald-500/60' : 'bg-slate-950 border-slate-800'} flex items-center justify-between cursor-pointer transition-colors">
            <div class="flex items-center gap-2 overflow-hidden mr-2">
              <input type="checkbox" ${it.selected ? 'checked' : ''} class="w-4 h-4 rounded text-emerald-600 bg-slate-900 border-slate-700 pointer-events-none">
              <div>
                <span class="font-mono font-bold text-xs ${it.selected ? 'text-emerald-400' : 'text-slate-400'}">${it.serial}</span>
                <span class="text-[10px] text-slate-500 ml-1 font-mono">${esUPC ? '(UPC Comercial)' : '(Serial)'}</span>
              </div>
            </div>
            <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded ${it.selected ? 'bg-emerald-900 text-emerald-300' : 'bg-slate-800 text-slate-500'}">
              ${it.selected ? 'Incluir' : 'Omitir'}
            </span>
          </div>
        `;
      }).join('');
    }

    function toggleSelectCodigo(id) {
      const item = codigosDetectados.find(c => c.id === id);
      if (item) {
        item.selected = !item.selected;
        redibujarCanvasFoto();
        renderizarListaCodigosDetectados();
      }
    }

    function marcarTodos(val) {
      codigosDetectados.forEach(c => c.selected = val);
      redibujarCanvasFoto();
      renderizarListaCodigosDetectados();
    }

    function importarCodigosSeleccionados() {
      const seleccionados = codigosDetectados.filter(c => c.selected);
      if (seleccionados.length === 0) return;

      let guardados = 0;
      seleccionados.forEach(c => {
        const ok = registrarSerial(c.serial, true);
        if (ok) guardados++;
      });

      soundSuccess();
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      showToast(`¡${guardados} seriales registrados!`, "success", 2500);

      reanudarCamaraEnVivo();
      switchTab('list');
    }

    // --- MANEJO DE PESTAÑAS ---
    function showToast(msg, type = "success", duration = 1500) {
      const box = document.getElementById('toast-box');
      box.innerHTML = '';
      const t = document.createElement('div');
      t.className = `toast-anim px-4 py-2 rounded-xl text-xs font-bold shadow-2xl border ${
        type === 'success' ? 'bg-slate-900 border-emerald-500/80 text-emerald-400' : 'bg-slate-900 border-amber-500/80 text-amber-400'
      }`;
      t.innerText = msg;
      box.appendChild(t);
      setTimeout(() => { box.innerHTML = ''; }, duration);
    }

    function switchTab(tab) {
      currentTab = tab;
      const camWrapper = document.getElementById('camera-global-wrapper');
      const pScan = document.getElementById('panel-scan');
      const pPhoto = document.getElementById('panel-photo');
      const pList = document.getElementById('panel-list');
      const bScan = document.getElementById('btn-nav-scan');
      const bPhoto = document.getElementById('btn-nav-photo');
      const bList = document.getElementById('btn-nav-list');
      const modeDesc = document.getElementById('header-mode-desc');
      const laserLine = document.getElementById('laser-line');

      // Ocultar paneles inferiores
      pScan.classList.add('hidden');
      pPhoto.classList.add('hidden');
      pList.classList.add('hidden');

      // Restaurar estilos de botones
      bScan.className = 'flex-1 flex flex-col items-center py-1 text-slate-400 hover:text-slate-200 text-xs';
      bPhoto.className = 'flex-1 flex flex-col items-center py-1 text-slate-400 hover:text-slate-200 text-xs';
      bList.className = 'flex-1 flex flex-col items-center py-1 text-slate-400 hover:text-slate-200 text-xs';

      if (tab === 'scan') {
        camWrapper.classList.remove('hidden');
        pScan.classList.remove('hidden');
        bScan.className = 'flex-1 flex flex-col items-center py-1 text-indigo-400 font-bold text-xs';
        modeDesc.innerText = "Modo Continuo (Code 128/39)";
        laserLine.classList.remove('hidden');
      } else if (tab === 'photo') {
        // En Foto Lote: CÁMARA SIEMPRE VISIBLE para poder apuntar
        camWrapper.classList.remove('hidden');
        pPhoto.classList.remove('hidden');
        bPhoto.className = 'flex-1 flex flex-col items-center py-1 text-indigo-400 font-bold text-xs';
        modeDesc.innerText = "Foto Lote (Enmarcar Códigos)";
        laserLine.classList.add('hidden'); // Apagamos el láser rojo continuo
      } else {
        // En la lista de seriales registrados: ocultamos la cámara para dar espacio a la tabla
        camWrapper.classList.add('hidden');
        pList.classList.remove('hidden');
        bList.className = 'flex-1 flex flex-col items-center py-1 text-indigo-400 font-bold text-xs';
        modeDesc.innerText = "Seriales Guardados";
        laserLine.classList.add('hidden');
      }
    }

    document.getElementById('obs-input').addEventListener('input', e => {
      localStorage.setItem('inv_html_obs', e.target.value);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const savedObs = localStorage.getItem('inv_html_obs');
      if (savedObs) document.getElementById('obs-input').value = savedObs;
      renderizarLista();
      iniciarCamaraDirecta();
    });
  </script>
</body>
