<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lector de Seriales - Inventario TI</title>
  <!-- Tailwind CSS y Html5-Qrcode por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    /* Ajustes para el visor en móvil */
    #reader { width: 100% !important; border: none !important; background: transparent !important; }
    #reader video { border-radius: 0.75rem; object-fit: cover; width: 100% !important; max-height: 230px; }
    #reader__scan_region { background: transparent !important; }
    #reader__dashboard_section_csr span, #reader__status_span { display: none !important; }

    /* Guía visual horizontal calibrada para seriales 1D */
    .laser-line {
      position: absolute; top: 50%; left: 10%; right: 10%; height: 2px;
      background: rgba(16, 185, 129, 0.85); box-shadow: 0 0 10px rgba(16, 185, 129, 1);
      transform: translateY(-50%); pointer-events: none; z-index: 10;
    }

    /* Animación Toast */
    .toast-anim {
      animation: popToast 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes popToast {
      from { opacity: 0; transform: translateY(-10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col min-h-screen select-none font-sans">

  <!-- Toast Flotante No Bloqueante -->
  <div id="toast-box" class="fixed top-14 left-0 right-0 z-50 flex flex-col items-center pointer-events-none px-4 max-w-sm mx-auto"></div>

  <!-- Barra Superior -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-md">
    <div>
      <h1 class="text-xs font-bold uppercase tracking-wider text-slate-200">Inventario TI</h1>
      <p class="text-[11px] text-emerald-400 font-semibold">Modo Serial (Code 128 / 39)</p>
    </div>
    <span id="badge-total" class="bg-indigo-950 border border-indigo-500/40 text-indigo-300 font-mono text-xs px-2.5 py-1 rounded-full font-bold">
      0 seriales
    </span>
  </header>

  <!-- Contenedor Principal -->
  <main class="flex-1 p-3 pb-24 overflow-y-auto space-y-3 max-w-md mx-auto w-full">
    
    <!-- PESTAÑA 1: ESCÁNER -->
    <section id="tab-scan" class="space-y-3">
      
      <!-- Campo Observación Fija -->
      <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl shadow-sm">
        <label for="obs-input" class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">
          Observación fija (Ubicación / Lote)
        </label>
        <input 
          type="text" 
          id="obs-input" 
          placeholder="Ej: Sala 102 - Torre A (se mantiene fija)" 
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors"
        />
      </div>

      <!-- Visor de Cámara HD Calibrado -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden p-1 relative shadow-inner">
        <div id="reader"></div>
        <div class="laser-line"></div>
        <div id="loading-cam" class="p-8 text-center text-xs text-slate-400">
          Iniciando cámara HD para barras finas...
        </div>
      </div>

      <!-- Barra de Controles de Cámara (Zoom y Flash) -->
      <div class="flex items-center justify-between bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl">
        <!-- Selector de Zoom -->
        <div id="zoom-container" class="hidden flex items-center gap-1">
          <span class="text-[11px] font-bold text-slate-400 mr-1 uppercase">Zoom:</span>
          <button id="btn-zoom-1" onclick="aplicarZoom(1)" class="bg-indigo-600 text-white text-xs font-mono font-bold px-2.5 py-1 rounded-md">1x</button>
          <button id="btn-zoom-2" onclick="aplicarZoom(2)" class="bg-slate-800 text-slate-300 hover:text-white text-xs font-mono font-bold px-2.5 py-1 rounded-md">2x</button>
        </div>
        <div id="zoom-placeholder" class="text-[11px] text-slate-500">Enfoque a 15-20 cm</div>

        <!-- Linterna -->
        <button id="btn-torch" onclick="toggleTorch()" class="hidden bg-slate-800 border border-slate-700 text-xs px-3 py-1.5 rounded-lg text-slate-300 active:bg-slate-700 flex items-center gap-1">
          <span>🔦</span> Linterna
        </button>
      </div>

      <!-- Botón de Acción Principal: Copiar para Google Sheets -->
      <button 
        onclick="copiarParaSheets()" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
        </svg>
        <span>📋 Copiar Lista para Sheets / Excel</span>
      </button>

      <!-- Entrada manual de respaldo o pistola de código de barras -->
      <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl flex gap-2">
        <input 
          type="text" 
          id="manual-input" 
          placeholder="Entrada manual o pistola USB..." 
          onkeydown="if(event.key==='Enter') agregarManual();" 
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono placeholder-slate-600 focus:outline-none focus:border-indigo-500"
        />
        <button onclick="agregarManual()" class="bg-slate-800 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700 text-slate-200">
          +
        </button>
      </div>
    </section>

    <!-- PESTAÑA 2: LISTA DE ESCANEADOS -->
    <section id="tab-list" class="hidden space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Seriales en Memoria Local</h2>
        <button onclick="vaciarTodoConfirm()" class="text-xs text-rose-400 hover:underline">
          Vaciar Todo
        </button>
      </div>
      <div id="items-container" class="space-y-1.5 max-h-[65vh] overflow-y-auto">
        <!-- Renderizado dinámico -->
      </div>
    </section>

  </main>

  <!-- Navegación Inferior Móvil -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around p-2 z-30">
    <button id="btn-nav-scan" onclick="switchNav('scan')" class="flex-1 flex flex-col items-center py-1 text-indigo-400 font-bold text-xs">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
      </svg>
      Escáner
    </button>
    <button id="btn-nav-list" onclick="switchNav('list')" class="flex-1 flex flex-col items-center py-1 text-slate-400 hover:text-slate-200 text-xs">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
      </svg>
      Lista (<span id="nav-count">0</span>)
    </button>
  </nav>

  <script>
    const STORAGE_KEY = 'inventario_html_seriales';
    let html5QrCode = null;
    let isProcessing = false;
    let isTorchOn = false;
    let lastCode = '';
    let lastTime = 0;

    // --- AUDIO SINTETIZADO ---
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine') {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    const soundSuccess = () => playTone(1200, 0.06);
    const soundDuplicate = () => { playTone(300, 0.1, 'square'); setTimeout(() => playTone(220, 0.12, 'square'), 110); };

    document.addEventListener('touchstart', () => getAudioCtx(), { once: true });
    document.addEventListener('click', () => getAudioCtx(), { once: true });

    // --- GESTIÓN DE LOCALSTORAGE ---
    function getDatos() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
    }

    function guardarDatos(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      renderizarLista();
    }

    function renderizarLista() {
      const items = getDatos();
      document.getElementById('badge-total').innerText = `${items.length} seriales`;
      document.getElementById('nav-count').innerText = items.length;

      const container = document.getElementById('items-container');
      if (items.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-600 text-center py-6">No hay seriales guardados.</p>';
        return;
      }

      container.innerHTML = items.map((it, idx) => `
        <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl flex justify-between items-center text-xs">
          <div class="overflow-hidden mr-2">
            <span class="font-mono font-bold text-emerald-400 text-sm">${it.serial}</span>
            <p class="text-[11px] text-slate-400 truncate">${it.observacion || '<i class="text-slate-600">Sin nota</i>'}</p>
            <span class="text-[10px] text-slate-500 font-mono">${it.fecha}</span>
          </div>
          <button onclick="eliminarItem(${idx})" class="text-slate-500 hover:text-rose-400 p-1.5 flex-shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
          </button>
        </div>
      `).join('');
    }

    function eliminarItem(idx) {
      const items = getDatos();
      const borrado = items.splice(idx, 1);
      guardarDatos(items);
      showToast(`Eliminado: ${borrado[0].serial}`, "warn");
    }

    function vaciarTodoConfirm() {
      if (confirm("¿Seguro de vaciar todos los seriales escaneados?")) {
        guardarDatos([]);
        showToast("Lista vaciada", "warn");
      }
    }

    // --- REGISTRO Y PARSEO ---
    function limpiarSerial(raw) {
      if (!raw) return '';
      let s = String(raw).replace(/[\x00-\x1F\x7F-\x9F]/g, '').trim();
      // Elimina posibles prefijos de fábrica como S/N, SN:, SERIAL:
      s = s.replace(/^(S\/N|SN|SERIAL)[\s:\-\]]*/i, '');
      // Elimina corchetes [ 9CP3151BM2 ] o paréntesis
      s = s.replace(/^[\[\(\{]+|[\]\)\}]+$/g, '').trim();
      return s;
    }

    function registrarSerial(serialBruto) {
      const limpio = limpiarSerial(serialBruto);
      if (!limpio) return;

      // FILTRO EXTRA: Si llegase a capturar 12 dígitos exactamente numéricos (UPC de la derecha), descartar
      if (/^\d{12}$/.test(limpio)) {
        showToast("UPC comercial ignorado", "warn", 1200);
        return;
      }

      const items = getDatos();

      // Validación anti-duplicados instantánea
      const existe = items.some(i => i.serial.toUpperCase() === limpio.toUpperCase());
      if (existe) {
        soundDuplicate();
        if (navigator.vibrate) navigator.vibrate([70, 50, 70]);
        showToast(`Ya existe: ${limpio}`, "warn");
        return;
      }

      const obs = document.getElementById('obs-input').value;
      const d = new Date();
      const fecha = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      // Guardar al inicio de la lista
      items.unshift({ serial: limpio, observacion: obs, fecha: fecha });
      guardarDatos(items);

      soundSuccess();
      if (navigator.vibrate) navigator.vibrate(50);
      showToast(`OK: ${limpio}`, "success");
    }

    function agregarManual() {
      const input = document.getElementById('manual-input');
      registrarSerial(input.value);
      input.value = '';
    }

    // --- EXPORTAR A GOOGLE SHEETS / EXCEL (TSV) ---
    async function copiarParaSheets() {
      const items = getDatos();
      if (items.length === 0) {
        alert("No hay seriales para copiar.");
        return;
      }

      const lineas = items.map(i => `${i.serial}\t${i.observacion || ''}\t${i.fecha}`);
      const tsvContent = `Serial\tObservación\tFecha\n` + lineas.join('\n');

      try {
        await navigator.clipboard.writeText(tsvContent);
        showToast(`¡Copiados ${items.length} seriales!`, "success", 2000);
        alert(`¡Copiado al portapapeles!\n\nAbre tu hoja de cálculo en Sheets o Excel y pega directamente (Ctrl+V). Cada dato quedará en su columna.`);
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = tsvContent;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast("Copiado al portapapeles", "success");
      }
    }

    // --- CÁMARA (ALTA RESOLUCIÓN Y FORMATOS EXCLUSIVOS CODE 128 / 39) ---
    function onScanSuccess(decodedText) {
      const raw = String(decodedText || '').trim();
      if (!raw) return;

      const now = Date.now();
      // Antirrebote de 2.5 seg si enfoca el mismo serial
      if (raw === lastCode && (now - lastTime) < 2500) return;

      if (isProcessing) return;
      isProcessing = true;
      lastCode = raw;
      lastTime = now;

      registrarSerial(raw);

      setTimeout(() => { isProcessing = false; }, 200);
    }

    async function initCamera() {
      const loadingEl = document.getElementById('loading-cam');

      try {
        // Restricción estricta: Únicamente decodificar Code 128 y Code 39 (Ceguera contra UPC/EAN)
        const formatosSerial = [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39
        ];

        html5QrCode = new Html5Qrcode("reader", {
          formatsToSupport: formatosSerial,
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          verbose: false
        });

        // Forzar resolución Full HD / HD para distinguir microbarras de alta densidad
        const cameraConstraints = {
          facingMode: "environment",
          width: { min: 1280, ideal: 1920 },
          height: { min: 720, ideal: 1080 }
        };

        // Mira rectangular alargada, estrecha en altura para calzar exactamente con el serial
        const scanConfig = { 
          fps: 25, 
          qrbox: (w, h) => {
            const boxW = Math.floor(Math.min(w * 0.90, 320));
            const boxH = Math.floor(Math.min(h * 0.32, 95));
            return { width: Math.max(boxW, 240), height: Math.max(boxH, 80) };
          },
          aspectRatio: 1.777778
        };

        try {
          await html5QrCode.start(cameraConstraints, scanConfig, onScanSuccess);
        } catch (e) {
          // Fallback en caso de que el navegador móvil rechace las restricciones ideales
          await html5QrCode.start({ facingMode: "environment" }, scanConfig, onScanSuccess);
        }

        loadingEl.classList.add('hidden');
        verificarCapacidadesCamara();

      } catch (err) {
        console.error(err);
        Html5Qrcode.getCameras().then(cams => {
          if (cams && cams.length) {
            html5QrCode.start(cams[cams.length - 1].id, { fps: 20, qrbox: { width: 280, height: 95 } }, onScanSuccess)
              .then(() => loadingEl.classList.add('hidden'));
          } else {
            loadingEl.innerText = "No se detectó cámara disponible.";
          }
        }).catch(() => {
          loadingEl.innerText = "Permiso denegado. Asegúrate de cargar por HTTPS.";
        });
      }
    }

    // --- VERIFICACIÓN DE ZOOM Y LINTERNA ---
    function verificarCapacidadesCamara() {
      try {
        const track = html5QrCode.getRunningTrackCameraCapabilities();
        
        // Linterna
        if (track && track.torchFeature && track.torchFeature().isSupported()) {
          document.getElementById('btn-torch').classList.remove('hidden');
        }

        // Zoom nativo
        if (track && track.zoomFeature && track.zoomFeature().isSupported()) {
          const maxZoom = track.zoomFeature().max();
          if (maxZoom >= 2) {
            document.getElementById('zoom-container').classList.remove('hidden');
            document.getElementById('zoom-placeholder').classList.add('hidden');
          }
        }
      } catch (e) {}
    }

    function toggleTorch() {
      if (!html5QrCode) return;
      isTorchOn = !isTorchOn;
      html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] }).catch(() => {});
    }

    function aplicarZoom(factor) {
      if (!html5QrCode) return;
      html5QrCode.applyVideoConstraints({
        advanced: [{ zoom: factor }]
      }).then(() => {
        document.getElementById('btn-zoom-1').className = factor === 1 ? "bg-indigo-600 text-white text-xs font-mono font-bold px-2.5 py-1 rounded-md" : "bg-slate-800 text-slate-300 hover:text-white text-xs font-mono font-bold px-2.5 py-1 rounded-md";
        document.getElementById('btn-zoom-2').className = factor === 2 ? "bg-indigo-600 text-white text-xs font-mono font-bold px-2.5 py-1 rounded-md" : "bg-slate-800 text-slate-300 hover:text-white text-xs font-mono font-bold px-2.5 py-1 rounded-md";
      }).catch(() => {});
    }

    // --- TOAST VISUAL ---
    function showToast(msg, type = "success", duration = 1500) {
      const box = document.getElementById('toast-box');
      box.innerHTML = '';
      const t = document.createElement('div');
      t.className = `toast-anim px-4 py-2 rounded-xl text-xs font-bold shadow-2xl border ${
        type === 'success' ? 'bg-slate-900 border-emerald-500/80 text-emerald-400' : 'bg-slate-900 border-amber-500/80 text-amber-400'
      }`;
      t.innerText = msg;
      box.appendChild(t);
      setTimeout(() => { box.innerHTML = ''; }, duration);
    }

    // --- PESTAÑAS ---
    function switchNav(tab) {
      const sScan = document.getElementById('tab-scan');
      const sList = document.getElementById('tab-list');
      const bScan = document.getElementById('btn-nav-scan');
      const bList = document.getElementById('btn-nav-list');

      if (tab === 'scan') {
        sScan.classList.remove('hidden');
        sList.classList.add('hidden');
        bScan.className = 'flex-1 flex flex-col items-center py-1 text-indigo-400 font-bold text-xs';
        bList.className = 'flex-1 flex flex-col items-center py-1 text-slate-400 hover:text-slate-200 text-xs';
      } else {
        sScan.classList.add('hidden');
        sList.classList.remove('hidden');
        bList.className = 'flex-1 flex flex-col items-center py-1 text-indigo-400 font-bold text-xs';
        bScan.className = 'flex-1 flex flex-col items-center py-1 text-slate-400 hover:text-slate-200 text-xs';
      }
    }

    // Persistencia de observación
    document.getElementById('obs-input').addEventListener('input', e => {
      localStorage.setItem('inv_html_obs', e.target.value);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const savedObs = localStorage.getItem('inv_html_obs');
      if (savedObs) document.getElementById('obs-input').value = savedObs;
      renderizarLista();
      initCamera();
    });
  </script>
</body>
</html>
